<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Antivergil</title>
  <link rel="stylesheet" href="login.css?v=20261124-home-editorial-2" />
</head>
<body>
  <main class="login-shell">
    <section class="login-main" aria-labelledby="login-title">
      <header class="login-top">
        <a class="login-brand" href="home.html" aria-label="Antivergil home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>antivergil</span>
        </a>
        <a class="login-back" id="login-back" href="index.html#/browse">
          <span>Back to planner</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M11 4l-8 8 8 8"/></svg>
        </a>
      </header>

      <div class="login-copy">
        <p class="login-kicker"><span>Columbia University</span><span>Spring 2027</span></p>
        <h1 id="login-title"><span>Welcome to</span>Antivergil</h1>
        <p class="login-lead">Plan a semester that fits your life, not just your schedule.</p>

        <div class="login-panel">
          <div class="login-panel-head">
            <p>Student access</p>
            <span>01 / 01</span>
          </div>
          <div class="login-auth">
            <div class="google-login-mount" id="google-login-mount"></div>
            <button class="google-login" id="google-login" type="button">
              <span class="google-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.97-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
              </span>
              <span>Continue with LionMail</span>
              <span class="button-arrow" aria-hidden="true">↗</span>
            </button>

            <form class="email-form" id="email-form" novalidate hidden>
              <label>
                <span>Columbia email*</span>
                <input name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" aria-describedby="login-status" placeholder="name@columbia.edu" required />
              </label>
              <button class="email-submit" type="submit">
                <span>Continue with Columbia email</span>
                <span aria-hidden="true">↗</span>
              </button>
            </form>

            <p class="login-status" id="login-status" aria-live="polite" hidden></p>
          </div>
        </div>
      </div>

      <footer class="login-footer">
        <p>Open only to <b>@columbia.edu</b> accounts.</p>
        <p>© 2026 Antivergil</p>
      </footer>
    </section>

    <figure class="login-visual">
      <img src="assets/intro-columbia/columbia-47.jpg" alt="A reading room at Columbia University" />
      <figcaption>
        <span>New York, NY</span>
        <span>40.8075° N / 73.9626° W</span>
      </figcaption>
    </figure>
  </main>

  <script src="data/auth-config.js?v=20261124-google-login-2"></script>
  <script src="login.js?v=20261124-google-login-6"></script>
</body>
</html>
