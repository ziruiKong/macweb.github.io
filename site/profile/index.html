<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e6ebf2;--accent:#2563eb}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:#fff;color:var(--ink);
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:44px;
  }
  a{color:inherit}
  .nav{
    position:sticky;top:0;z-index:100;height:44px;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{max-width:1280px;height:44px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .nav-logo img{height:26px;width:auto;display:block}
  .nav-links{display:flex;list-style:none;height:44px;align-items:center;flex:1;justify-content:center;gap:38px;padding:0;margin:0}
  .nav-links a{
    color:#0f172a;font-size:15px;font-weight:500;text-decoration:none;height:44px;display:flex;align-items:center;
    font-family:"Jost","Century Gothic","Futura","Segoe UI",sans-serif;transition:color .2s;
  }
  .nav-links a:hover,.nav-links a.active{color:#38bdf8}
  .nav-toggle{display:none;background:none;border:0;cursor:pointer;color:#334155;padding:0}
  .nav-toggle svg{width:18px;height:18px;fill:currentColor}
  .mobile-menu{
    display:none;position:fixed;top:50px;right:16px;left:auto;width:min(240px,calc(100vw - 32px));
    z-index:99;padding:8px 16px;background:rgba(255,255,255,.96);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 14px 36px rgba(15,23,42,.14);overflow:hidden;
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  }
  .mobile-menu.open{display:block}
  .mobile-menu ul{list-style:none;margin:0;padding:0}
  .mobile-menu a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
  .mobile-menu li:last-child a{border-bottom:0}
  @media (max-width:833px){.nav-links{display:none}.nav-toggle{display:flex;align-items:center}}

  .wrap{max-width:980px;margin:0 auto;padding:14px 24px 0}
  .block{padding:26px 0 6px}
  #education{padding-top:46px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-head h2{
    margin:0;padding:5px 12px;background:#38bdf8;color:#fff;line-height:1.25;
    font-size:26px;font-weight:700;letter-spacing:.02em;
    font-family:"Jost","Century Gothic","Futura","Segoe UI",sans-serif;
  }
  .rule{flex:1;height:1px;background:var(--line)}
  .chart-card{position:relative;display:flex;align-items:center;background:transparent;border:0;border-radius:0;padding:8px 0}
  .tl-chart{width:100%;height:auto;display:block}
  .edu-mobile{display:none}
  .tl-bar{cursor:pointer}
  .tl-bar rect{fill:#fff;stroke:#cbd5e1;stroke-width:1;transition:filter .16s ease}
  .tl-bar:hover rect{filter:brightness(.9)}
  .tl-tip{
    position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    background:#0f172a;color:#fff;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.35;
    white-space:nowrap;transition:opacity .15s ease;z-index:5;box-shadow:0 8px 24px rgba(15,23,42,.22);
  }
  .tl-tip.show{opacity:1}
  .tl-tip strong{display:block;font-size:13px;margin-bottom:1px}
  .tl-tip .d{display:block;color:#cbd5e1}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:90;height:44px;display:flex;align-items:center;
    padding:0 24px;border-top:1px solid var(--line);background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  }
  .share-row{display:flex;align-items:center;gap:14px;width:100%;max-width:1080px;margin:0 auto}
  .updated{margin-left:auto;color:var(--muted);font-family:"Jost","Century Gothic","Futura","Segoe UI",sans-serif;font-size:12px;white-space:nowrap}
  .icon-btn{display:flex;align-items:center;justify-content:center;color:#334155;padding:6px;text-decoration:none;transition:.18s}
  .icon-btn:hover{color:var(--accent)}
  .icon-btn svg{width:18px;height:18px;fill:currentColor}

  @media (max-width:600px){
    body{padding-bottom:0}
    .wrap{padding:0 24px}
    #education{padding-top:34px}
    .sec-head h2{font-size:22px}
    .chart-card{display:block;width:calc(100% + 48px);margin-left:-24px;margin-right:-24px;padding:10px 24px 54px}
    .tl-chart{display:none}
    .edu-mobile{display:flex;flex-direction:column;gap:8px;width:100%}
    .edu-mobile-item{
      display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:10px;
      min-height:60px;padding:11px 13px;background:#f7f9fc;border:1px solid var(--line);
      border-radius:10px;cursor:pointer;transition:box-shadow .16s ease,transform .16s ease;
    }
    .edu-mobile-item:hover,.edu-mobile-item:focus-visible,.edu-mobile-item[aria-expanded="true"]{
      outline:none;box-shadow:0 0 0 2px rgba(14,165,233,.35);transform:translateY(-1px);
    }
    .edu-mobile-logo{width:30px;height:30px;object-fit:contain;display:block}
    .edu-mobile-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
    .edu-mobile-code{font-family:"Jost","Century Gothic","Futura","Segoe UI",sans-serif;font-size:15px;font-weight:700;line-height:1.2}
    .edu-mobile-date{flex:none;color:#475569;font-family:"Jost","Century Gothic","Futura","Segoe UI",sans-serif;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
    .tl-tip{width:min(92%,360px);white-space:normal;font-size:12px;padding:9px 11px}
    footer{padding:0 16px}
    .share-row{gap:12px}
    .updated{font-size:11px}
  }
</style>

<script>
  (function(){
    var toggle=document.getElementById('navToggle');
    var menu=document.getElementById('mobileMenu');
    toggle.addEventListener('click',function(){
      var open=menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded',open?'true':'false');
    });

    var tip=document.getElementById('tlTip');
    var chart=document.getElementById('eduChart');
    document.querySelectorAll('.tl-bar').forEach(function(bar){
      bar.addEventListener('mousemove',function(e){
        var r=chart.getBoundingClientRect();
        tip.innerHTML='<strong>'+bar.getAttribute('data-title')+'</strong><span class="d">'+bar.getAttribute('data-sub')+'</span>';
        tip.style.left=(e.clientX-r.left)+'px';
        tip.style.top=(e.clientY-r.top-12)+'px';
        tip.classList.add('show');
      });
      bar.addEventListener('mouseleave',function(){tip.classList.remove('show')});
    });

    var mobileItems=document.querySelectorAll('.edu-mobile-item');
    mobileItems.forEach(function(item){
      function toggleTip(e){
        if(e)e.preventDefault();
        var wasOpen=item.getAttribute('aria-expanded')==='true';
        mobileItems.forEach(function(other){other.setAttribute('aria-expanded','false')});
        if(wasOpen){tip.classList.remove('show');return;}
        var r=chart.getBoundingClientRect();
        var ir=item.getBoundingClientRect();
        tip.innerHTML='<strong>'+item.getAttribute('data-title')+'</strong><span class="d">'+item.getAttribute('data-sub')+'</span>';
        tip.style.left=(ir.left-r.left+ir.width/2)+'px';
        tip.style.top=(ir.top-r.top-8)+'px';
        tip.classList.add('show');
        item.setAttribute('aria-expanded','true');
      }
      item.addEventListener('click',toggleTip);
      item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){toggleTip(e)}});
    });
  })();
</script>
